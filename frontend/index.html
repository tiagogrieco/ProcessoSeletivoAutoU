<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoU | Email Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>

    <main class="container">
        <header class="header">
            <h1 class="logo">AutoU <span class="highlight">Intelligence</span></h1>
            <p class="subtitle">Classificação e Resposta Automática de Emails</p>
        </header>

        <div class="glass-card">
            <div class="tabs">
                <button class="tab-btn active" data-target="upload-tab">Upload de Arquivo</button>
                <button class="tab-btn" data-target="text-tab">Texto Direto</button>
            </div>

            <div class="tab-content active" id="upload-tab">
                <div class="upload-area" id="upload-area">
                    <div class="upload-icon">📤</div>
                    <p>Arraste e solte seu arquivo (.txt, .pdf ou .msg)</p>
                    <p class="upload-hint">ou</p>
                    <input type="file" id="file-input" accept=".txt,.pdf,.msg" hidden>
                    <button type="button" class="secondary-btn"
                        onclick="document.getElementById('file-input').click()">Selecionar Arquivo</button>
                    <p id="file-name" class="file-name"></p>
                </div>
                <button type="button" class="primary-btn" onclick="processFile()">Processar Arquivo</button>
            </div>

            <div class="tab-content" id="text-tab">
                <textarea id="email-text" placeholder="Cole o conteúdo do email aqui para análise..."></textarea>
                <button type="button" class="primary-btn" onclick="processText()">Processar Texto</button>
            </div>
        </div>

        <div class="results-section hidden" id="results-section">
            <div class="glass-card result-card">
                <div class="result-header">
                    <h2>Resultado da Análise</h2>
                    <span class="badge" id="category-badge">Calculando...</span>
                </div>

                <div class="result-body">
                    <h3>Email Original</h3>
                    <div class="email-original-box" id="email-original">
                        <!-- Original email content -->
                    </div>

                    <h3>Resposta Sugerida</h3>
                    <div class="response-box" id="response-content">
                        <!-- Response content will be injected here -->
                    </div>
                    <div class="action-row">
                        <button class="secondary-btn" onclick="copyResponse()">Copiar Resposta</button>
                        <button class="secondary-btn" onclick="resetApp()">Nova Análise</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="loading-overlay hidden" id="loading-overlay">
            <div class="spinner"></div>
            <p>Analisando conteúdo com AI...</p>
        </div>
    </main>

    <footer class="footer">
        <p>Desenvolvido para AutoU Challenge</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
